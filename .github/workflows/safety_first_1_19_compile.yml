name: Safety-first 1.19 source tests (no artifacts)

on:
  push:
    branches:
      - integration/stable-1-19-safety-first-20261022

permissions:
  contents: read
  packages: read

jobs:
  compile:
    if: github.repository == 'lxsdd/morphe-desktop-public'
    name: Test explicit-target ADB variant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Build and test only, never publish
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew test --no-daemon
