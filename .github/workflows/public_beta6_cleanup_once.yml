name: Owner-only one-shot cleanup of older public Morphe builds

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  cleanup:
    if: >-
      github.repository == 'lxsdd/morphe-desktop-public' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'morphe-public-cleanup-approved' &&
      github.actor == github.repository_owner &&
      github.event.pull_request.number == 50 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'integration/public-safe-morphe-220-patcher-240-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_LABEL: morphe-public-cleanup-approved
      CURRENT_TAG: custom-v2.2.0-beta.6-81fff4b45b94
      CURRENT_SHA: 81fff4b45b94ce20b2129ca6051fc9dece957667
      CURRENT_ZIP: Morphe-Desktop-Custom-2.2.0-beta.6-81fff4b45b94.zip
      ZIP_SHA256: 5c17d6e3a8d6dbe7830fae087481d8e64555dfd4e940fafe7a4affb9af93d4b4
      HEAD_AT_APPROVAL: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Verify exact successful published beta.6, GitHub owner approval and release allowlist
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api "repos/$repo/pulls/50" > "$RUNNER_TEMP/pr.json"
          gh api "repos/$repo/actions/runs/43976853939" > "$RUNNER_TEMP/run.json"
          gh api "repos/$repo/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ['RUNNER_TEMP'])
          def get(name): return json.loads((d/name).read_text())
          pr,run,rels=get('pr.json'),get('run.json'),get('releases.json')
          assert pr['state']=='open' and pr['number']==50
          assert pr['head']['sha']==os.environ['HEAD_AT_APPROVAL']
          assert pr['head']['repo']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert pr['head']['ref']=='integration/public-safe-morphe-220-patcher-240-20261115'
          assert pr['base']['ref']=='main'
          assert os.environ['APPROVAL_LABEL'] in [l['name'] for l in pr['labels']]
          assert run['head_sha']==os.environ['CURRENT_SHA'] and run['status']=='completed'
          assert run['conclusion']=='success' and run['actor']['login']=='lxsdd'
          assert run['name']=='Owner-approved full Custom Windows beta (SHA-bound)'
          expected={
            'custom-v2.2.0-core-preview.2-32a3ea82bc37': ('32a3ea82bc3752006c11b5f893e10e150c1ea804','90a0cfd4fd95923d7120992187363fac8ecae4f11c3cc06d7bc6023486b77955'),
            'custom-v2.2.0-beta.5-049a1d544f4f': ('049a1d544f4f334b1efdb5e844fe317a6245227e','2a031c27b4802e781fdcd98e440a24dafd31aaef702ea846f0fafee7c50c0a87'),
            'custom-v2.2-core-preview-970ddcf0b271': ('970ddcf0b2712e75556ee33af37283b8a017ffa8','0b9ef0654332066e7e7b281179677652cf8ca021de4c645f9f474a0c35dbcf66'),
            'custom-v2.1.1-beta.4': ('200e810bd5220ba292f85c9381781661320183b9','278c760b102ed54970095953c724b7157df0727cefcef607361b050500c6e3de'),
          }
          latest=os.environ['CURRENT_TAG']
          inventory={r['tag_name']:r for r in rels}
          assert len(inventory)==len(rels) and set(inventory)<=set(expected)|{latest},'Unexpected release: no deletion'
          current=inventory[latest]
          assert current['target_commitish']==os.environ['CURRENT_SHA']
          assert not current['draft'] and current['prerelease'] and len(current['assets'])==2
          assert len([a for a in current['assets'] if a['name']==os.environ['CURRENT_ZIP'] and a['digest']=='sha256:'+os.environ['ZIP_SHA256']])==1
          assert len([a for a in current['assets'] if a['name']=='SHA256SUMS.txt'])==1
          rows=[]
          for tag,(sha,digest) in expected.items():
            if tag not in inventory: continue
            r=inventory[tag]
            assert r['target_commitish']==sha and not r['draft'] and r['prerelease']
            assert len(r['assets'])==2
            assert len([a for a in r['assets'] if a['name'].endswith('.zip') and a['digest']=='sha256:'+digest])==1
            assert r['id']!=current['id']
            rows.append(f"{r['id']}\t{tag}\n")
          (d/'delete-ids.tsv').write_text(''.join(rows))
          print('EXACT_PUBLIC_CLEANUP_PREFLIGHT=PASS older_releases',len(rows),'git_tags_preserved=yes')
          PY
      - name: Re-download published complete Windows beta.6 and check SHA-256
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/verified-release"
          mkdir -p "$d"
          gh release download "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$CURRENT_ZIP" --dir "$d"
          gh release download "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir "$d"
          printf '%s  %s\n' "$ZIP_SHA256" "$d/$CURRENT_ZIP" | sha256sum -c -
          tr -d '\r' < "$d/SHA256SUMS.txt" | grep -Fx "$ZIP_SHA256  $CURRENT_ZIP"
          echo 'NEW_RELEASE_READBACK=PASS'
      - name: Delete only approved older public release IDs, preserve all Git tags and source
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          while IFS=$'\t' read -r id tag; do
            [ -n "$id" ] || continue
            current="$(gh api "repos/$repo/releases/$id" --jq .tag_name)"
            [ "$current" = "$tag" ] || { echo "Release ID was replaced; abort"; exit 1; }
            case "$tag" in
              custom-v2.2.0-core-preview.2-32a3ea82bc37|custom-v2.2.0-beta.5-049a1d544f4f|custom-v2.2-core-preview-970ddcf0b271|custom-v2.1.1-beta.4) ;;
              *) echo 'Unapproved release ID'; exit 1 ;;
            esac
            gh api -X DELETE "repos/$repo/releases/$id" >/dev/null
            echo "DELETED_OLD_PUBLIC_RELEASE=$tag ID=$id; Git tag preserved"
          done < "$RUNNER_TEMP/delete-ids.tsv"
          gh api "repos/$repo/releases?per_page=100" > "$RUNNER_TEMP/remaining.json"
          python3 - <<'PY'
          import json,os,pathlib
          arr=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'remaining.json').read_text())
          assert len(arr)==1 and arr[0]['tag_name']==os.environ['CURRENT_TAG']
          assert arr[0]['target_commitish']==os.environ['CURRENT_SHA']
          assert not arr[0]['draft'] and len(arr[0]['assets'])==2
          print('PUBLIC_RELEASE_RETENTION=PASS only_current_full_beta6_remains')
          PY
