name: Custom 2.0 source-stage tests (no release)
on:
  push:
    branches:
      - integration/custom-2-0-source-stage-20261104
      - integration/custom-2-0-upstream-20261104
permissions:
  contents: read
concurrency:
  group: custom-2-source-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests:
    if: github.repository == 'lxsdd/morphe-desktop-public'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Configure repository cache mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.m2"
          path="$HOME/.m2/settings.xml"
          if [ ! -f "$path" ]; then printf '%s\n' '<settings></settings>' > "$path"; fi
          sed -i.bak 's#</settings>#<mirrors><mirror><id>gcs-maven-central</id><mirrorOf>central</mirrorOf><url>https://maven-central.storage-download.googleapis.com/maven2/</url></mirror></mirrors></settings>#' "$path"
          rm -f "$path.bak"
      - name: Compile and test source-stage (never upload binaries)
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew test --no-daemon -Dorg.gradle.mirror.maven.settings=true
      - name: Build executable Windows desktop JAR
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew shadowJar --no-daemon -Dorg.gradle.mirror.maven.settings=true
      - name: Verify launcher, archive and SHA-256 without binary upload
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jars = @(Get-ChildItem -LiteralPath 'build/libs' -Filter '*-all.jar' -File)
          if ($jars.Count -ne 1) { throw "Expected one desktop archive; found $($jars.Count)" }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead($jars[0].FullName)
          try {
            if (-not ($archive.Entries.FullName -contains 'app/morphe/MorpheLauncherKt.class')) {
              throw 'Launcher class missing from executable JAR'
            }
          }
          finally { $archive.Dispose() }
          $hash = (Get-FileHash -LiteralPath $jars[0].FullName -Algorithm SHA256).Hash
          Write-Host "CUSTOM_2_WINDOWS_JAR=PASS SHA256=$hash NO_BINARY_UPLOAD=YES"
      - name: Package verified desktop-only ZIP for 48 hours
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jars = @(Get-ChildItem -LiteralPath 'build/libs' -Filter '*-all.jar' -File)
          if ($jars.Count -ne 1) { throw 'Expected exactly one JAR for preview' }
          $dir = Join-Path $env:RUNNER_TEMP 'morphe-custom-2.0.0'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item -LiteralPath $jars[0].FullName -Destination $dir
          $hash = (Get-FileHash -LiteralPath $jars[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($jars[0].Name)" | Set-Content -Path (Join-Path $dir 'SHA256SUMS.txt') -Encoding utf8
          @(
            'Morphe Desktop Custom 2.0.0 - review candidate, not an upstream release.'
            "Source commit: ${{ github.sha }}"
            'Built and tested on a public Windows GitHub Actions runner.'
            'This archive contains desktop software only, no patched Android APK or signing material.'
            'The app has not been exercised with a real phone in this qualification.'
            'Preserve your current working 1.19 JAR until device acceptance.'
          ) | Set-Content -Path (Join-Path $dir 'README.txt') -Encoding utf8
          $archive = Join-Path $env:RUNNER_TEMP 'Morphe-Desktop-Custom-2.0.0-Windows.zip'
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $archive -CompressionLevel Optimal
          if ((Get-Item $archive).Length -lt 1024) { throw 'Invalid or empty desktop ZIP' }
          Write-Host "CUSTOM_2_ZIP=PASS FILE=$archive SHA256=$((Get-FileHash $archive -Algorithm SHA256).Hash)"
      - name: Offer Windows ZIP temporarily via public Actions
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Morphe-Desktop-Custom-2.0.0-Windows-${{ github.sha }}
          path: ${{ runner.temp }}/Morphe-Desktop-Custom-2.0.0-Windows.zip
          retention-days: 2
          if-no-files-found: error
