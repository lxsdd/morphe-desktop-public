name: Custom 2.1.1 source-stage tests (no release)
on:
  push:
    branches:
      - integration/custom-2-0-source-stage-20261104
      - integration/custom-2-0-upstream-20261104
permissions:
  contents: read
concurrency:
  group: custom-2-source-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests:
    if: github.repository == 'lxsdd/morphe-desktop-public' && github.event.head_commit.message != 'ci(morphe-public): remove obsolete 2.1.1 preview artifact 13761868505'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Configure repository cache mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.m2"
          path="$HOME/.m2/settings.xml"
          if [ ! -f "$path" ]; then printf '%s\n' '<settings></settings>' > "$path"; fi
          sed -i.bak 's#</settings>#<mirrors><mirror><id>gcs-maven-central</id><mirrorOf>central</mirrorOf><url>https://maven-central.storage-download.googleapis.com/maven2/</url></mirror></mirrors></settings>#' "$path"
          rm -f "$path.bak"
      - name: Verify default Compose resource keys before compiling
        shell: bash
        run: python tools/verify_compose_resource_keys.py
      - name: Hash-verify official and Amazon-compatible stable MPPs (Linux smoke)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/official-patches-2.1.0.mpp"
          curl -fL --retry 2 --retry-delay 2 --connect-timeout 20 \
            'https://github.com/MorpheApp/morphe-patches/releases/download/v2.1.0/patches-2.1.0.mpp' \
            -o "$bundle"
          echo '114eafa139ea3018f35af3498e8e67fe7850d4dd22a6065a02e891699dcc5e96  '"$bundle" | sha256sum -c -
          echo "MORPHE_OFFICIAL_PATCHES_TEST_FILE=$bundle" >> "$GITHUB_ENV"
          thirdparty="$RUNNER_TEMP/rushiranpise-patches-1.23.1.mpp"
          curl -fL --retry 2 --retry-delay 2 --connect-timeout 20 \
            'https://github.com/rushiranpise/morphe-patches/releases/download/v1.23.1/patches-1.23.1.mpp' \
            -o "$thirdparty"
          echo '75ede4e416edf147be8132b6c7693d78b37264a1a89dd2c4fa835efccefcdd9d  '"$thirdparty" | sha256sum -c -
          echo "MORPHE_THIRDPARTY_PATCHES_TEST_FILE=$thirdparty" >> "$GITHUB_ENV"
      - name: Compile and test source-stage (never upload binaries)
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew test --no-daemon -Dorg.gradle.mirror.maven.settings=true
      - name: Build executable Windows desktop JAR
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew shadowJar --no-daemon -Dorg.gradle.mirror.maven.settings=true
      - name: Verify launcher, archive and SHA-256 without binary upload
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jars = @(Get-ChildItem -LiteralPath 'build/libs' -Filter '*-all.jar' -File)
          if ($jars.Count -ne 1) { throw "Expected one desktop archive; found $($jars.Count)" }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead($jars[0].FullName)
          try {
            if (-not ($archive.Entries.FullName -contains 'app/morphe/MorpheLauncherKt.class')) {
              throw 'Launcher class missing from executable JAR'
            }
          }
          finally { $archive.Dispose() }
          $hash = (Get-FileHash -LiteralPath $jars[0].FullName -Algorithm SHA256).Hash
          Write-Host "CUSTOM_2_WINDOWS_JAR=PASS SHA256=$hash NO_BINARY_UPLOAD=YES"

      - name: Package explicitly requested public Windows desktop review ZIP
        if: >-
          matrix.os == 'windows-latest' &&
          github.repository == 'lxsdd/morphe-desktop-public' &&
          github.ref == 'refs/heads/integration/custom-2-0-upstream-20261104' &&
          github.event.head_commit.message == 'ci(public-preview): package 2.1.1 public-source Windows build'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jars = @(Get-ChildItem -LiteralPath 'build/libs' -Filter '*-all.jar' -File)
          if ($jars.Count -ne 1) { throw "Expected one runnable desktop JAR; found $($jars.Count)" }
          $stage = Join-Path $env:RUNNER_TEMP 'morphe-public-preview'
          $dist = Join-Path (Get-Location) 'build/public-preview'
          New-Item -ItemType Directory -Force -Path $stage, $dist | Out-Null
          $outputJar = Join-Path $stage $jars[0].Name
          Copy-Item -LiteralPath $jars[0].FullName -Destination $outputJar
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $stage 'LICENSE.txt')
          @'
          @echo off
          setlocal
          where java >nul 2>&1
          if errorlevel 1 (
            echo Java 21 is required. Install a Java 21 runtime and retry.
            exit /b 1
          )
          for %%J in ("%~dp0morphe-desktop-*-all.jar") do set "MORPHE_JAR=%%~fJ"
          if not defined MORPHE_JAR (
            echo Morphe Desktop JAR missing from this folder.
            exit /b 1
          )
          java -jar "%MORPHE_JAR%" %*
          exit /b %ERRORLEVEL%
          '@ | Set-Content -LiteralPath (Join-Path $stage 'Start-Morphe-Windows.cmd') -Encoding ascii
          @"
          Morphe Desktop Custom 2.1.1 - PUBLIC SOURCE REVIEW BUILD
          Source: https://github.com/lxsdd/morphe-desktop-public/tree/$env:GITHUB_SHA
          License: GPL-3.0 (see LICENSE.txt)
          Run Start-Morphe-Windows.cmd on Windows with Java 21 installed.
          This archive contains only publicly available source-built components.
          It is NOT the private downstream build, a release candidate, a signed
          Android APK, or a verified Windows/Android runtime acceptance.
          "@ | Set-Content -LiteralPath (Join-Path $stage 'README.txt') -Encoding utf8
          $jarHash = (Get-FileHash -LiteralPath $outputJar -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($jarHash -ne (Get-FileHash -LiteralPath $jars[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw 'JAR SHA-256 changed during packaging'
          }
          "$jarHash  $($jars[0].Name)" | Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii
          $zip = Join-Path $dist "Morphe-Desktop-Custom-2.1.1-PUBLIC-$env:GITHUB_SHA.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression
          $opened = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($opened.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @($jars[0].Name, 'LICENSE.txt', 'README.txt', 'Start-Morphe-Windows.cmd', 'SHA256SUMS.txt')) {
              if ($entries -notcontains $required) { throw "Missing public ZIP entry: $required" }
            }
          } finally { $opened.Dispose() }
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "MORPHE_PUBLIC_PREVIEW=PASS SOURCE_SHA=$env:GITHUB_SHA JAR_SHA256=$jarHash ZIP_SHA256=$zipHash"
      - name: Upload one explicitly requested public preview (not a release)
        if: >-
          matrix.os == 'windows-latest' &&
          github.repository == 'lxsdd/morphe-desktop-public' &&
          github.ref == 'refs/heads/integration/custom-2-0-upstream-20261104' &&
          github.event.head_commit.message == 'ci(public-preview): package 2.1.1 public-source Windows build'
        uses: actions/upload-artifact@v7
        with:
          name: Morphe-Desktop-Custom-2.1.1-PUBLIC-${{ github.sha }}
          path: build/public-preview/Morphe-Desktop-Custom-2.1.1-PUBLIC-${{ github.sha }}.zip
          if-no-files-found: error
          archive: false
          retention-days: 2

  delete-obsolete-preview:
    name: Delete exactly one owner-rejected public Windows ZIP
    if: >-
      github.repository == 'lxsdd/morphe-desktop-public' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/integration/custom-2-0-upstream-20261104' &&
      github.event.head_commit.message == 'ci(morphe-public): remove obsolete 2.1.1 preview artifact 13761868505'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Read, identity-check and delete only public artifact 13761868505
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=13761868505
          result="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$target")"
          jq -e '.id == 13761868505 and .name == "Morphe-Desktop-Custom-2.1.1-PUBLIC-2aa878b65a92d80cb51e5158527b9285fde58479.zip" and .size_in_bytes == 61579707 and .workflow_run.id == 42810093337' <<< "$result" >/dev/null
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$target"
          if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$target" > /dev/null 2>&1; then
            echo "::error::Requested artifact still exists after deletion"
            exit 1
          fi
          echo "OWNER_REJECTED_PUBLIC_ZIP_DELETED=PASS ARTIFACT_ID=$target"
          echo "Public review artifact 13761868505 deleted; no other artifact IDs affected." >> "$GITHUB_STEP_SUMMARY"
