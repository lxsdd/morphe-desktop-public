name: Custom 1.19 exact-serial device handoff preview (public, 2 days)

on:
  push:
    branches:
      - delivery/public-device-handoff-preview-20261023

permissions:
  contents: read
  packages: read

concurrency:
  group: morphe-public-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-jar:
    if: github.repository == 'lxsdd/morphe-desktop-public'
    name: Build and publish explicitly authorized preview JAR
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERIFIED_CODE_SHA: edb4762ff1c2874dc76b43e96dd75da5bc48b96c
    steps:
      - name: Checkout public source with no persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Ensure only the preview workflow changed since verified code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$VERIFIED_CODE_SHA"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$changed" = '.github/workflows/public_device_handoff_preview.yml'
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "Verified source baseline: $VERIFIED_CODE_SHA"
      - name: Set up JetBrains JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Run test suite and build unsigned desktop fat JAR
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew test shadowJar --no-daemon
      - name: Verify archive and prepare short-lived preview download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*-all.jar' -print)
          test "${#jars[@]}" -eq 1
          test -s "${jars[0]}"
          unzip -t "${jars[0]}" > /dev/null
          unzip -Z -1 "${jars[0]}" > "$RUNNER_TEMP/preview-entries.txt"
          grep -Fqx 'app/morphe/MorpheLauncherKt.class' "$RUNNER_TEMP/preview-entries.txt"
          cp "${jars[0]}" preview/morphe-desktop-custom-1.19.0-device-handoff-preview.jar
          (
            cd preview
            sha256sum morphe-desktop-custom-1.19.0-device-handoff-preview.jar > SHA256.txt
            {
              echo "PREVIEW ONLY - NO RELEASE APPROVAL."
              echo "This artifact is visible and downloadable to other signed-in users of the public repository."
              echo "It contains a desktop JAR only, not a signed Android APK."
              echo "Do not install/uninstall anything on physical Android devices with this preview."
              echo "Known limitations: success/progress/link state is now keyed to exact selected ADB serial. The user can select another device on the result screen, but no installation is automatic. Only read-only visual inspection is authorized for acceptance; do not install/uninstall APKs. Device-import and final physical Windows acceptance are pending."
              echo "Official upstream base: Morphe Desktop 1.19.0"
              echo "Verified code SHA: $VERIFIED_CODE_SHA"
              echo "Build commit SHA: $GITHUB_SHA"
              echo "Tests: ./gradlew test shadowJar --no-daemon"
            } > README-PREVIEW.txt
          )
          echo "PASS: Preview fat JAR checked; SHA256 is in preview/SHA256.txt"
      - name: Upload public preview for 2 days only
        uses: actions/upload-artifact@v4
        with:
          name: morphe-desktop-custom-1.19.0-DEVICE-HANDOFF-edb4762ff1c2
          path: |
            preview/morphe-desktop-custom-1.19.0-device-handoff-preview.jar
            preview/SHA256.txt
            preview/README-PREVIEW.txt
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
