name: Exact device ownership installer source tests

on:
  push:
    branches:
      - integration/1-19-install-ownership-safety-20261022

permissions:
  contents: read
  packages: read

jobs:
  tests:
    name: Ownership guard tests (${{ matrix.os }})
    if: github.repository == 'lxsdd/morphe-desktop-public'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Run simulated installer tests only
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew test --no-daemon
