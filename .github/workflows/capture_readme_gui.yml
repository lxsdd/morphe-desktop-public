name: Capture real public-beta README screenshots

on:
  push:
    branches:
      - docs/readme-screenshots-20261111

permissions:
  contents: write

jobs:
  capture:
    if: github.repository == 'lxsdd/morphe-desktop-public' && github.ref == 'refs/heads/docs/readme-screenshots-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Build the same public source (no release artifact)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew shadowJar --no-daemon
      - name: Install ephemeral virtual-screen capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick
      - name: Capture real clean-profile UI and validate images
        shell: bash
        run: bash .github/scripts/capture_readme_gui.sh
      - name: Commit only the two generated screenshots to this documentation branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/current/desktop-apps.png docs/images/current/desktop-sources.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
            exit 0
          fi
          git commit -m "docs: refresh authentic 2.1.1 UI screenshots"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push origin HEAD:docs/readme-screenshots-20261111
