name: Public source CI (no distribution)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: public-source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    if: github.repository == 'lxsdd/morphe-desktop-public'
    name: Source and tests (${{ matrix.os }})
    # Keep the exact required macOS check name; use the supported, capacity-stable macOS 15 ARM runner.
    # macos-latest (macOS 26 ARM) was cancelled after 15 minutes without a runner twice.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-15' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout unprivileged candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify exact public beta product and dependency source
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'integration/custom-2-0-upstream-20261104'
        shell: bash
        run: python tools/verify_public_beta_source_manifest.py
      - name: Set up JetBrains JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Verify pinned official and legacy MPP runtime fixtures
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          official="$RUNNER_TEMP/official-patches-2.1.0.mpp"
          curl -fL --retry 2 --connect-timeout 20 \
            'https://github.com/MorpheApp/morphe-patches/releases/download/v2.1.0/patches-2.1.0.mpp' -o "$official"
          echo "114eafa139ea3018f35af3498e8e67fe7850d4dd22a6065a02e891699dcc5e96  $official" | sha256sum -c -
          echo "MORPHE_OFFICIAL_PATCHES_TEST_FILE=$official" >> "$GITHUB_ENV"
          amazon="$RUNNER_TEMP/legacy-amazon-patches-1.23.1.mpp"
          curl -fL --retry 2 --connect-timeout 20 \
            'https://github.com/rushiranpise/morphe-patches/releases/download/v1.23.1/patches-1.23.1.mpp' -o "$amazon"
          echo "75ede4e416edf147be8132b6c7693d78b37264a1a89dd2c4fa835efccefcdd9d  $amazon" | sha256sum -c -
          echo "MORPHE_THIRDPARTY_PATCHES_TEST_FILE=$amazon" >> "$GITHUB_ENV"
          riky="$RUNNER_TEMP/legacy-riky-patches-2.3.2.mpp"
          curl -fL --retry 2 --connect-timeout 20 \
            'https://github.com/riky-dev/morphe-patches/releases/download/v2.3.2/patches-2.3.2.mpp' -o "$riky"
          echo "6c257bcae4023a73c92e9cb9d00589baeef4dbc6997f7137f6dead27bb35e764  $riky" | sha256sum -c -
          echo "MORPHE_RIKY_PATCHES_TEST_FILE=$riky" >> "$GITHUB_ENV"
      - name: Build and run tests; do not upload artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew build --no-daemon

  package-preflight:
    if: github.repository == 'lxsdd/morphe-desktop-public'
    name: PR desktop JAR integrity
    needs: source-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - name: Checkout same PR source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify exact public beta product and dependency source
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'integration/custom-2-0-upstream-20261104'
        shell: bash
        run: python tools/verify_public_beta_source_manifest.py
      - name: Set up JetBrains JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Build read-only desktop candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew shadowJar --no-daemon
      - name: Verify exact desktop JAR, entrypoint and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' jars < <(find build/libs -maxdepth 1 -type f -name '*-all.jar' -print0)
          if (( ${#jars[@]} != 1 )); then
            echo "::error::Expected exactly one fat JAR, got ${#jars[@]}"
            exit 1
          fi
          jar="${jars[0]}"
          test -s "$jar"
          unzip -t "$jar" > /dev/null
          unzip -Z -1 "$jar" > "$RUNNER_TEMP/morphe-jar-entries.txt"
          grep -Fqx 'app/morphe/MorpheLauncherKt.class' "$RUNNER_TEMP/morphe-jar-entries.txt"
          sha256sum "$jar"
          echo "PASS: single desktop JAR verified; no distribution artifact published."
