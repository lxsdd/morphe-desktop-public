name: Public source CI (no distribution)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: public-source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    if: github.repository == 'lxsdd/morphe-desktop-public'
    name: Source and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout unprivileged candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JetBrains JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Build and run tests; do not upload artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew build --no-daemon

  package-preflight:
    if: github.repository == 'lxsdd/morphe-desktop-public'
    name: PR desktop JAR integrity
    needs: source-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - name: Checkout same PR source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JetBrains JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Build read-only desktop candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew shadowJar --no-daemon
      - name: Verify exact desktop JAR, entrypoint and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' jars < <(find build/libs -maxdepth 1 -type f -name '*-all.jar' -print0)
          if (( ${#jars[@]} != 1 )); then
            echo "::error::Expected exactly one fat JAR, got ${#jars[@]}"
            exit 1
          fi
          jar="${jars[0]}"
          test -s "$jar"
          unzip -t "$jar" > /dev/null
          unzip -Z -1 "$jar" | grep -Fqx 'app/morphe/MorpheLauncherKt.class'
          sha256sum "$jar"
          echo "PASS: single desktop JAR verified; no distribution artifact published."
