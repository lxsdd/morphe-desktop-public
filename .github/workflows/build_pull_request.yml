name: Public source CI (no distribution)

on:
  push:
    branches:
      - integration/sanitized-private-1-18-1-20261022
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: public-source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    if: github.repository == 'lxsdd/morphe-desktop-public'
    name: Source and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout unprivileged candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JetBrains JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Build and run tests; do not upload artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew build --no-daemon
